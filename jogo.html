<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ajude a Karoline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0b0614; color: #eeeafe; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 12px 28px; }
  #palco { position: relative; width: 100%; max-width: 400px; }
  canvas { width: 100%; display: block; border-radius: 16px; border: 1px solid #7f3fd6; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 24px rgba(168,85,247,.35); }
  .tela { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: rgba(11, 6, 20, 0.9); border-radius: 16px; text-align: center; }
  .tela h1 { font-size: 26px; color: #d8b4fe; text-shadow: 0 0 12px #a855f7; line-height: 1.2; }
  .tela p { font-size: 15px; color: #c4b5fd; }
  .tela img { height: 140px; filter: drop-shadow(0 0 14px rgba(168,85,247,.7)); }
  .premio { background: linear-gradient(135deg, rgba(252,211,77,.18), rgba(168,85,247,.22)); border: 1px solid rgba(252,211,77,.55); border-radius: 12px; padding: 8px 14px; color: #fde68a !important; font-weight: 700; }
  input { width: 100%; max-width: 260px; padding: 12px; border-radius: 10px; border: 1px solid #a855f7; background: #1a1033; color: #fff; font-size: 16px; text-align: center; }
  button { padding: 12px 28px; border: none; border-radius: 999px; background: #a855f7; color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 0 16px #a855f7; cursor: pointer; }
  button.sec { background: transparent; border: 2px solid #c4b5fd; box-shadow: none; font-size: 15px; padding: 10px 22px; }
  button:active { transform: scale(.96); }
  .erro { color: #fca5a5; font-size: 13px; min-height: 16px; }
  .oculto { display: none !important; }
  #txtPontos { font-size: 30px !important; color: #fcd34d !important; font-weight: 800; text-shadow: 0 0 14px rgba(251,191,36,.7); }
  #txtPosicao { font-size: 17px !important; color: #fff !important; font-weight: 700; }
  #txtPodio { color: #fde68a !important; font-weight: 700; }

  /* ===== RANKING VISUAL ===== */
  #ranking { width: 100%; max-width: 400px; margin-top: 18px; }
  #ranking h2 { font-size: 20px; color: #d8b4fe; text-align: center; text-shadow: 0 0 12px #a855f7; }
  #ranking .sub { text-align: center; font-size: 13px; color: #fde68a; margin: 4px 0 16px; }
  .podio { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-bottom: 14px; min-height: 40px; }
  .lugar { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lugar svg { width: 44px; height: 44px; }
  .lugar.p1 svg { width: 62px; height: 62px; animation: brilho 2s ease-in-out infinite; }
  .lugar .nome { font-weight: 700; font-size: 14px; word-break: break-word; text-align: center; line-height: 1.2; }
  .lugar .pts { font-size: 13px; color: #c4b5fd; }
  .degrau { width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #0b0614; }
  .p1 .degrau { height: 92px; background: linear-gradient(180deg,#fde68a,#fbbf24); box-shadow: 0 0 20px #fbbf24; }
  .p2 .degrau { height: 68px; background: linear-gradient(180deg,#f8fafc,#cbd5e1); box-shadow: 0 0 14px #cbd5e1; }
  .p3 .degrau { height: 52px; background: linear-gradient(180deg,#fed7aa,#fb923c); box-shadow: 0 0 14px #fb923c; }
  .lugar.eu .nome { color: #fcd34d; }
  @keyframes brilho { 0%,100% { filter: drop-shadow(0 0 4px #fbbf24); } 50% { filter: drop-shadow(0 0 14px #fde68a); } }
  #lista { list-style: none; }
  #lista li { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #2a1850; font-size: 15px; }
  #lista li span:first-child { color: #c4b5fd; }
  #lista li.eu { background: rgba(168,85,247,.22); border-radius: 8px; border-bottom-color: transparent; }
  #lista li.eu span { color: #fff; font-weight: 700; }
  .vazio { text-align: center; color: #c4b5fd; padding: 16px 0; font-size: 15px; }
  .dica { font-size: 12px; color: #8b7bb5; margin-top: 10px; text-align: center; }
  .dica a { color: #c4b5fd; }
</style>
</head>

const ctx = canvas.getContext('2d');
const W = 360, H = 600;                       // tamanho "logico" do jogo
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR; canvas.height = H * DPR; // desenho nitido em tela de celular
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const imgKarol = new Image();
imgKarol.src = document.querySelector('#telaInicio img').src;
const KW = 30, KH = 77; // tamanho da Karoline no jogo

// dentro do convite (janela do botão): o convite já tem o botão Voltar
const DENTRO_DO_CONVITE = window.self !== window.top;
if (DENTRO_DO_CONVITE) document.getElementById('linkConvite').classList.add('oculto');

let estado, direcao = 0, nomeJogador = '';
const estrelas = [];
for (let i = 0; i < 70; i++) estrelas.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, f: Math.random() * 6 });

const CORES_FESTA = ['#fcd34d', '#a855f7', '#d8b4fe', '#f472b6', '#ffffff', '#c084fc', '#e5e7eb'];

// ===== RANKING =====
// transforma "Ana Paula" em "ana paula" e tira caracteres que o Firebase nao aceita
function chaveDoNome(nome) { return nome.toLowerCase().replace(/[.#$\[\]\/]/g, '').trim(); }
function limpar(t) { return String(t).replace(/[<>&"]/g, ''); }

async function carregarRanking() {
  try {
    const resp = await fetch(FIREBASE_URL + '/ranking.json', { cache: 'no-store' });
    const dados = await resp.json() || {};
    return Object.values(dados).filter(p => p && p.nome).sort((a, b) => b.pontos - a.pontos);
  } catch (e) { return null; } // null = sem internet / erro
}

async function salvarPontuacao(nome, pontos) {
  const url = FIREBASE_URL + '/ranking/' + encodeURIComponent(chaveDoNome(nome)) + '.json';
  try {
    const atual = await (await fetch(url)).json();
    if (atual && atual.pontos >= pontos) return atual.pontos; // nao bateu o recorde: nao muda nada
    await fetch(url, { method: 'PUT', body: JSON.stringify({ nome: nome, pontos: pontos }) });
  } catch (e) {}
  return pontos;
}

function trofeu(cor) {
  return `<svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M20 8h24v14a12 12 0 0 1-24 0z" fill="${cor}"/>
    <path d="M20 12h-8a8 8 0 0 0 8 12M44 12h8a8 8 0 0 1-8 12" fill="none" stroke="${cor}" stroke-width="4"/>
    <rect x="29" y="34" width="6" height="10" fill="${cor}"/>
    <rect x="20" y="44" width="24" height="8" rx="2" fill="${cor}"/>
  </svg>`;
}

function ehEu(p) { return nomeJogador && chaveDoNome(p.nome) === chaveDoNome(nomeJogador); }

async function mostrarRanking() {
  const lista = await carregarRanking();
  const podio = document.getElementById('podio');
  const el = document.getElementById('lista');
  if (lista === null) { podio.innerHTML = ''; el.innerHTML = '<p class="vazio">Não foi possível carregar o ranking agora</p>'; return lista; }
  if (!lista.length) { podio.innerHTML = ''; el.innerHTML = '<p class="vazio">Ninguém jogou ainda. Seja o primeiro! 🚀</p>'; return lista; }

  const top = lista; // mostra TODOS os participantes
  document.getElementById('totalJogadores').textContent = '👥 ' + lista.length + (lista.length === 1 ? ' participante' : ' participantes');
  const cores = ['#fcd34d', '#e5e7eb', '#fdba74'];
  podio.innerHTML = [1, 0, 2] // mostra 2º, 1º, 3º (o 1º no meio e mais alto)
    .filter(i => top[i])
    .map(i => `<div class="lugar p${i + 1}${ehEu(top[i]) ? ' eu' : ''}">
        ${trofeu(cores[i])}
        <div class="nome">${limpar(top[i].nome)}${ehEu(top[i]) ? ' (você)' : ''}</div>
        <div class="pts">${top[i].pontos} pts</div>
        <div class="degrau">${i + 1}º</div>
      </div>`).join('');
  el.innerHTML = top.slice(3)
    .map((p, i) => `<li class="${ehEu(p) ? 'eu' : ''}"><span>${i + 4}º ${limpar(p.nome)}${ehEu(p) ? ' (você)' : ''}</span><span>${p.pontos}</span></li>`).join('');
  return lista;
}

// ===== NUVENS E ARGOLAS =====
function novaNuvem(y) {
  const alt = estado.alturaMax;
  const largura = Math.max(55, 90 - alt / 300);
  const x = Math.random() * (W - largura);
  const move = alt > 2500 && Math.random() < 0.3;
  estado.nuvens.push({ x, y, w: largura, vel: move ? (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.min(2, alt / 6000)) : 0 });
  if (Math.random() < 0.4) estado.argolas.push({ x: x + largura / 2, y: y - 40, pega: false });
  estado.ultimaNuvemY = y;
}
function espacoEntreNuvens() { return 75 + Math.min(45, estado.alturaMax / 200) + Math.random() * 25; }

function reiniciar() {
  estado = {
    k: { x: W / 2, y: H - 80, vx: 0, vy: FORCA_PULO, lado: 1 },
    nuvens: [], argolas: [], camera: 0, alturaMax: 0, bonus: 0,
    idade: 0, festa: 0, festaTotal: 0, flash: 0, jogando: true, ultimaNuvemY: H - 40,
    particulas: [], baloes: [], textos: [], dica: 150, quadro: 0
  };
  estado.nuvens.push({ x: W / 2 - 45, y: H - 40, w: 90, vel: 0 });
  let y = H - 40;
  while (y > -H) { y -= espacoEntreNuvens(); novaNuvem(y); }
}

function pontos() { return Math.floor(estado.alturaMax / 10) + estado.bonus; }

// ===== EFEITOS (confete, fogos, baloes, textos) =====
// "tela: true" = fica parado na tela; "tela: false" = acompanha o mundo do jogo
function confete(qtde, x, y, tela) {
  for (let i = 0; i < qtde; i++) {
    estado.particulas.push({
      tipo: 'confete', tela,
      x: x !== undefined ? x : Math.random() * W,
      y: y !== undefined ? y : -10 - Math.random() * 200,
      vx: (Math.random() - 0.5) * (x !== undefined ? 7 : 2.5),
      vy: x !== undefined ? -Math.random() * 6 - 1 : Math.random() * 2 + 1.5,
      g: 0.12, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
      w: 4 + Math.random() * 5, h: 7 + Math.random() * 7,
      cor: CORES_FESTA[Math.floor(Math.random() * CORES_FESTA.length)], vida: 220
    });
  }
}
function fogos(x, y) {
  const cor = CORES_FESTA[Math.floor(Math.random() * CORES_FESTA.length)];
  for (let i = 0; i < 44; i++) {
    const ang = (Math.PI * 2 * i) / 44, v = 2 + Math.random() * 2.6;
    estado.particulas.push({ tipo: 'faisca', tela: true, x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, g: 0.045, cor, vida: 60 + Math.random() * 25, vidaMax: 85 });
  }
}
function brilhinho(x, y) {
  for (let i = 0; i < 10; i++) {
    const ang = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2;
    estado.particulas.push({ tipo: 'faisca', tela: false, x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, g: 0.02, cor: '#fcd34d', vida: 30, vidaMax: 30 });
  }
}
function textoFlutuante(t, x, y, cor, tam) {
  estado.textos.push({ t, x, y, cor, tam: tam || 16, vida: 60 });
}
function soltarBaloes() {
  for (let i = 0; i < 10; i++) {
    estado.baloes.push({
      x: 20 + Math.random() * (W - 40), y: H + 30 + Math.random() * 220,
      vy: 1.2 + Math.random() * 1.2, fase: Math.random() * 6, r: 13 + Math.random() * 6,
      cor: ['#a855f7', '#d8b4fe', '#e5e7eb', '#fcd34d', '#c084fc'][i % 5]
    });
  }
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// A GRANDE FESTA DOS 18 (o jogo continua rolando por baixo)
function festaDos18() {
  estado.festa = 330; estado.festaTotal = 330; estado.flash = 1;
  confete(170);
  soltarBaloes();
  fogos(W * 0.25, 170); fogos(W * 0.75, 200);
  vibrar([120, 60, 120, 60, 400]);
}

// ===== CONTROLES =====
function lerDirecao(e) {
  const r = canvas.getBoundingClientRect();
  direcao = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); lerDirecao(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (e.buttons) lerDirecao(e); });
canvas.addEventListener('pointerup', () => direcao = 0);
canvas.addEventListener('pointercancel', () => direcao = 0);
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') direcao = -1; if (e.key === 'ArrowRight') direcao = 1; });
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') direcao = 0; });

// ===== LOGICA DO JOGO =====
function atualizarEfeitos() {
  estado.quadro++;
  for (const p of estado.particulas) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vida--;
    if (p.tipo === 'confete') { p.rot += p.vr; p.vx *= 0.99; if (p.vy > 3) p.vy = 3; }
    else { p.vx *= 0.97; p.vy *= 0.97; }
  }
  estado.particulas = estado.particulas.filter(p => p.vida > 0 && p.y < (p.tela ? H + 20 : estado.camera + H + 20));
  for (const b of estado.baloes) { b.y -= b.vy; b.fase += 0.05; }
  estado.baloes = estado.baloes.filter(b => b.y > -80);
  for (const t of estado.textos) { t.y -= 0.9; t.vida--; }
  estado.textos = estado.textos.filter(t => t.vida > 0);
  if (estado.flash > 0) estado.flash = Math.max(0, estado.flash - 0.04);
  if (estado.dica > 0) estado.dica--;

  if (estado.festa > 0) {
    estado.festa--;
    if (estado.festa % 32 === 0) fogos(40 + Math.random() * (W - 80), 90 + Math.random() * 180);
    if (estado.festa % 10 === 0) confete(8);
  } else if (estado.idade >= 18 && estado.quadro % 240 === 0) {
    fogos(40 + Math.random() * (W - 80), 80 + Math.random() * 120); // modo festa: fogos de vez em quando
  }
}

function atualizar() {
  if (!estado) return;
  atualizarEfeitos();
  if (!estado.jogando) return;
  const k = estado.k;
  k.vx += (direcao * VELOCIDADE_LADO - k.vx) * 0.25;
  k.x += k.vx;
  if (direcao) k.lado = direcao;
  if (k.x < -KW / 2) k.x = W + KW / 2;       // sai de um lado, entra do outro
  if (k.x > W + KW / 2) k.x = -KW / 2;

  const peAntes = k.y;
  k.vy += GRAVIDADE;
  k.y += k.vy;

  for (const n of estado.nuvens) {
    if (n.vel) { n.x += n.vel; if (n.x < 0 || n.x + n.w > W) n.vel *= -1; }
    // so quica quando esta caindo e o pe passa pela nuvem
    if (k.vy > 0 && peAntes <= n.y && k.y >= n.y && k.x > n.x - 8 && k.x < n.x + n.w + 8) {
      k.y = n.y; k.vy = FORCA_PULO;
    }
  }
  for (const a of estado.argolas) {
    if (!a.pega && Math.abs(a.x - k.x) < 24 && Math.abs(a.y - (k.y - KH / 2)) < KH / 2 + 6) {
      a.pega = true;
      const valor = estado.idade >= 18 ? 100 : 50;
      estado.bonus += valor;
      brilhinho(a.x, a.y);
      textoFlutuante('+' + valor, a.x, a.y - 10, '#fcd34d', 17);
    }
  }

  if (k.y - KH < estado.camera + H * 0.4) estado.camera = k.y - KH - H * 0.4;
  estado.alturaMax = Math.max(estado.alturaMax, (H - 80) - k.y);

  const novaIdade = Math.min(18, Math.floor(estado.alturaMax / ALTURA_POR_ANO));
  if (novaIdade > estado.idade) {
    estado.idade = novaIdade;
    if (novaIdade === 18) festaDos18();
    else {
      textoFlutuante('🎂 ' + novaIdade + (novaIdade === 1 ? ' aninho!' : ' anos!'), k.x, k.y - KH - 10, '#f5d0fe', 18);
      confete(14, k.x, k.y - KH, false);
      vibrar(30);
    }
  }

  while (estado.ultimaNuvemY > estado.camera - 120) novaNuvem(estado.ultimaNuvemY - espacoEntreNuvens());
  estado.nuvens = estado.nuvens.filter(n => n.y < estado.camera + H + 50);
  estado.argolas = estado.argolas.filter(a => a.y < estado.camera + H + 50);

  if (k.y - KH - estado.camera > H) fimDeJogo();
}

// ===== DESENHO =====
function desenharNuvem(n) {
  const y = n.y - estado.camera;
  ctx.fillStyle = estado.idade >= 18 ? '#f5e8ff' : '#e9d5ff';
  ctx.shadowColor = estado.idade >= 18 ? '#fcd34d' : '#c084fc'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.ellipse(n.x + n.w / 2, y + 4, n.w / 2, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(n.x + n.w * 0.35, y - 2, n.w * 0.22, 9, 0, 0, Math.PI * 2);
  ctx.ellipse(n.x + n.w * 0.65, y - 3, n.w * 0.25, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}
function texto(t, x, y, tam, cor, alinhar) {
  ctx.fillStyle = cor; ctx.font = `700 ${tam}px system-ui, sans-serif`; ctx.textAlign = alinhar || 'center'; ctx.fillText(t, x, y);
}
function desenharFundo() {
  const festa = estado && estado.idade >= 18;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (festa) { g.addColorStop(0, '#2a0b4a'); g.addColorStop(1, '#140a2a'); }
  else { g.addColorStop(0, '#140a2a'); g.addColorStop(1, '#0e0620'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cam = estado ? estado.camera : 0;
  const t = estado ? estado.quadro : 0;
  for (const e of estrelas) {
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(e.f + t * 0.03));
    ctx.fillStyle = festa ? '#fde68a' : '#8b6fd6';
    ctx.fillRect(e.x, ((e.y - cam * 0.2) % H + H) % H, e.r, e.r);
  }
  ctx.globalAlpha = 1;
}
function desenharParticulas(tela) {
  const cam = estado.camera;
  for (const p of estado.particulas) {
    if (p.tela !== tela) continue;
    const y = tela ? p.y : p.y - cam;
    if (p.tipo === 'confete') {
      ctx.save(); ctx.translate(p.x, y); ctx.rotate(p.rot);
      ctx.fillStyle = p.cor; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot)));
      ctx.restore();
    } else {
      ctx.globalAlpha = Math.max(0, p.vida / p.vidaMax);
      ctx.fillStyle = p.cor; ctx.beginPath(); ctx.arc(p.x, y, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function desenharBaloes() {
  for (const b of estado.baloes) {
    const x = b.x + Math.sin(b.fase) * 8;
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, b.y + b.r * 1.2); ctx.quadraticCurveTo(x - 6, b.y + b.r * 2.2, x + 2, b.y + b.r * 3.3); ctx.stroke();
    ctx.fillStyle = b.cor; ctx.shadowColor = b.cor; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(x, b.y, b.r, b.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(x - b.r * 0.35, b.y - b.r * 0.45, b.r * 0.22, b.r * 0.32, -0.5, 0, Math.PI * 2); ctx.fill();
  }
}
function desenharFesta() {
  // aparece em cima, pra nao tapar as nuvens onde ela esta pulando
  const passado = estado.festaTotal - estado.festa;
  const entra = Math.min(1, passado / 25), sai = Math.min(1, estado.festa / 40);
  const a = Math.min(entra, sai);
  const pulsa = 1 + Math.sin(passado * 0.15) * 0.06;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(88,28,135,0.72)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(20, 56, W - 40, 128, 18) : ctx.rect(20, 56, W - 40, 128); ctx.fill();
  ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2; ctx.stroke();
  ctx.translate(W / 2, 112); ctx.scale(pulsa, pulsa);
  ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 22;
  texto('18', 0, 8, 58, '#fde68a');
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 10;
  texto('🎉 Parabéns, Karoline! 🎉', W / 2, 150, 20, '#ffffff');
  ctx.shadowBlur = 0;
  texto('Chegou aos 18! Continue subindo ✨', W / 2, 172, 13, '#f5d0fe');
  ctx.restore();
}
function desenhar() {
  desenharFundo();
  if (!estado) return;
  const cam = estado.camera;

  desenharBaloes();
  estado.nuvens.forEach(desenharNuvem);

  ctx.lineWidth = 3; ctx.strokeStyle = '#fcd34d'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 8;
  for (const a of estado.argolas) if (!a.pega) { ctx.beginPath(); ctx.arc(a.x, a.y - cam, 9, 0, Math.PI * 2); ctx.stroke(); }
  ctx.shadowBlur = 0;

  desenharParticulas(false);

  // Karoline (vira para o lado que esta indo) — depois dos 18 ganha um brilho dourado
  const k = estado.k;
  ctx.save();
  ctx.translate(k.x, k.y - cam);
  ctx.scale(k.lado, 1);
  if (estado.idade >= 18) { ctx.shadowColor = '#fcd34d'; ctx.shadowBlur = 16; }
  ctx.drawImage(imgKarol, -KW / 2, -KH, KW, KH);
  ctx.restore();

  for (const t of estado.textos) {
    ctx.globalAlpha = Math.min(1, t.vida / 25);
    texto(t.t, t.x, t.y - cam, t.tam, t.cor);
  }
  ctx.globalAlpha = 1;

  desenharParticulas(true);
  if (estado.festa > 0) desenharFesta();

  // placar
  ctx.fillStyle = 'rgba(11,6,20,0.8)'; ctx.fillRect(0, 0, W, 48);
  texto('Pontos: ' + pontos(), 12, 28, 16, '#eeeafe', 'left');
  const festa = estado.idade >= 18;
  texto(festa ? '🎉 18 anos! Modo festa' : 'Idade: ' + estado.idade + ' anos', W - 12, 28, 16, festa ? '#fcd34d' : '#eeeafe', 'right');
  // barrinha até o próximo aniversário
  const prog = festa ? 1 : (estado.alturaMax % ALTURA_POR_ANO) / ALTURA_POR_ANO;
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 44, W, 4);
  ctx.fillStyle = festa ? '#fcd34d' : '#a855f7'; ctx.fillRect(0, 44, W * prog, 4);

  // dica dos controles nos primeiros segundos
  if (estado.dica > 0 && estado.jogando) {
    ctx.globalAlpha = Math.min(1, estado.dica / 40) * 0.8;
    texto('◀ segure', 50, H - 24, 15, '#d8b4fe');
    texto('segure ▶', W - 50, H - 24, 15, '#d8b4fe');
    ctx.globalAlpha = 1;
  }

  if (estado.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${estado.flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
}

// passo fixo: o jogo roda na mesma velocidade em qualquer celular (60 ou 120 Hz)
const PASSO = 1000 / 60;
let acumulado = 0, ultimo = performance.now();
function loop(agora) {
  acumulado += Math.min(250, agora - ultimo);
  ultimo = agora;
  while (acumulado >= PASSO) { atualizar(); acumulado -= PASSO; }
  desenhar();
  requestAnimationFrame(loop);
}

// ===== TELAS =====
function comecar() {
  const nome = document.getElementById('nome').value.trim();
  if (!nome) { document.getElementById('erro').textContent = 'Digite seu nome para entrar no ranking'; return; }
  nomeJogador = nome;
  try { localStorage.setItem('ultimoNome', nome); } catch (e) {}
  document.getElementById('telaInicio').classList.add('oculto');
  document.getElementById('telaFim').classList.add('oculto');
  document.getElementById('palco').scrollIntoView({ behavior: 'smooth', block: 'start' });
  reiniciar();
}
async function fimDeJogo() {
  estado.jogando = false; direcao = 0;
  vibrar(200);
  const pts = pontos();
  document.getElementById('txtPontos').textContent = pts + ' pontos';
  document.getElementById('txtRecorde').textContent = 'Salvando...';
  document.getElementById('txtPosicao').textContent = '';
  document.getElementById('txtPodio').textContent = '';
  document.getElementById('telaFim').classList.remove('oculto');
  const recorde = await salvarPontuacao(nomeJogador, pts);
  document.getElementById('txtRecorde').textContent = 'Seu recorde: ' + recorde;
  const lista = await mostrarRanking();
  if (lista && lista.length) {
    const pos = lista.findIndex(ehEu) + 1;
    if (pos > 0) {
      document.getElementById('txtPosicao').textContent = 'Você está em ' + pos + 'º lugar!';
      document.getElementById('txtPodio').textContent = pos <= 3
        ? '🎁 Você está no pódio! Segura aí até a festa!'
        : 'Faltam ' + (lista[2].pontos - recorde + 1) + ' pts pro pódio 💪';
      if (pos <= 3) confete(90);
    }
  }
}
document.getElementById('btnJogar').onclick = comecar;
document.getElementById('btnDeNovo').onclick = comecar;
document.getElementById('btnVerRanking').onclick = () => document.getElementById('ranking').scrollIntoView({ behavior: 'smooth' });
document.getElementById('nome').oninput = () => document.getElementById('erro').textContent = '';
document.getElementById('nome').onkeydown = e => { if (e.key === 'Enter') comecar(); };
